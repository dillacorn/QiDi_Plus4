[main]
default_printer: Plus4
show_cursor: True
keyboard_navigation: True
use_dpms: False
screen_blanking: off
autolock_timeout: 0
job_complete_timeout: 0
job_error_timeout: 0

[printer Plus4]
# Required:
# Use the printer's LAN IP when running KlipperScreen on the same local network.
moonraker_host: 192.168.68.118

# Required:
# Replace this with your real Moonraker API key.
# Do not commit your real API key to a public repo.
moonraker_api_key: YOUR_REAL_API_KEY_HERE

# Default direct Moonraker connection.
moonraker_port: 7125
moonraker_ssl: False

# Optional:
# Use this instead of the LAN IP only if Tailscale/MagicDNS is working.
# moonraker_host: qidi.time-puffin.ts.net

# Optional:
# Use this only if Moonraker is being exposed through HTTPS on port 443.
# moonraker_host: qidi.time-puffin.ts.net
# moonraker_port: 443
# moonraker_ssl: True

move_distances: 0.1, 1, 5, 10, 25, 50

# Force useful laptop menu entries
[menu __main move]
name: Move
icon: move
panel: move

[menu __main home_all]
name: Home All
icon: home
method: printer.gcode.script
params: {"script":"G28"}

[menu __main home_x]
name: Home X
icon: home-x
method: printer.gcode.script
params: {"script":"G28 X"}

[menu __main home_y]
name: Home Y
icon: home-y
method: printer.gcode.script
params: {"script":"G28 Y"}

[menu __main home_z]
name: Home Z
icon: home-z
method: printer.gcode.script
params: {"script":"G28 Z"}